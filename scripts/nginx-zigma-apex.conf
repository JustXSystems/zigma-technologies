# Production nginx — apex-only HTTPS (SEO Phase 1.6).
# Apply with: sudo bash scripts/apply-nginx-apex-redirect.sh
# Cert paths match the existing Certbot live directory for zigma-technologies.com.

# 1) Any http:// request (apex or www) -> https://zigma-technologies.com
server {
    listen 80;
    listen [::]:80;
    server_name zigma-technologies.com www.zigma-technologies.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zigma-technologies;
        try_files $uri =404;
    }

    location / {
        return 301 https://zigma-technologies.com$request_uri;
    }
}

# 2) https://www -> https://zigma-technologies.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zigma-technologies.com;

    ssl_certificate /etc/letsencrypt/live/zigma-technologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zigma-technologies.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zigma-technologies.com$request_uri;
}

# 3) The real site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zigma-technologies.com;

    ssl_certificate /etc/letsencrypt/live/zigma-technologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zigma-technologies.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CMS / resume uploads (keep in sync with MEDIA_UPLOAD_MAX_MB)
    client_max_body_size 250M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zigma-technologies;
        try_files $uri =404;
    }

    # CMS library media from disk — NEVER proxy large videos through Node (OOM / 502 risk).
    # URI /assets/images/x → /var/www/zigma-technologies/public/assets/images/x
    location ^~ /assets/images/ {
        root /var/www/zigma-technologies/public;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800";
        try_files $uri =404;
    }
    location ^~ /assets/svg/ {
        root /var/www/zigma-technologies/public;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800";
        try_files $uri =404;
    }
    location ^~ /assets/video/ {
        root /var/www/zigma-technologies/public;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800";
        # Byte-range friendly for HTML5 video (nginx default for static files)
        try_files $uri =404;
    }

    # Private form uploads — never expose as static files (admin download APIs only)
    location ^~ /assets/uploads/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 250M;
        # Fail fast when Node is wedged instead of holding connections for minutes
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
