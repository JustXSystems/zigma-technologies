# Meridian control-plane sidecar — does NOT rebuild or restart the live website.
# Ships ~1 MiB of Node CLI outside the site tree.
#
# Callable from Deploy Production / Deploy PreProd (parallel with the Next build)
# or standalone via workflow_dispatch.
name: Deploy Meridian

on:
  workflow_dispatch:
    inputs:
      plane:
        description: Target VPS (prod = Zigma Production, preprod = JustXSystems)
        type: choice
        options:
          - prod
          - preprod
        default: prod
      branch:
        description: Git branch
        type: string
        default: master
      target_dir:
        description: Absolute path on VPS (outside website tree)
        type: string
        default: /var/www/zigma-meridian
  workflow_call:
    inputs:
      plane:
        description: Target VPS (prod | preprod)
        type: string
        required: false
        default: prod
      branch:
        description: Git branch
        type: string
        required: false
        default: master
      target_dir:
        description: Absolute path on VPS (outside website tree)
        type: string
        required: false
        default: /var/www/zigma-meridian

jobs:
  deploy-meridian:
    name: Ship Meridian CLI → VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          sparse-checkout: |
            packages/meridian
          sparse-checkout-cone-mode: false

      - name: Resolve SSH secrets for plane
        id: ssh
        shell: bash
        env:
          PLANE: ${{ inputs.plane }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PREPROD_HOST: ${{ secrets.PREPROD_HOST }}
          PREPROD_SSH_USER: ${{ secrets.PREPROD_SSH_USER }}
          PREPROD_SSH_KEY: ${{ secrets.PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          PLANE="$(echo "${PLANE:-prod}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$PLANE" == "preprod" ]]; then
            HOST="$PREPROD_HOST"
            USER="$PREPROD_SSH_USER"
            KEY="$PREPROD_SSH_KEY"
            LABEL="PREPROD"
            if [[ "$HOST" == "200.234.45.106" ]]; then
              echo "PREPROD_HOST must not be Production IP" >&2
              exit 1
            fi
          elif [[ "$PLANE" == "prod" ]]; then
            HOST="$PROD_HOST"
            USER="$PROD_SSH_USER"
            KEY="$PROD_SSH_KEY"
            LABEL="PROD"
            if [[ "$HOST" == "193.203.161.219" ]]; then
              echo "PROD_HOST must not be PreProd IP" >&2
              exit 1
            fi
          else
            echo "plane must be prod or preprod (got: $PLANE)" >&2
            exit 1
          fi
          if [[ -z "$HOST" || -z "$USER" || -z "$KEY" ]]; then
            echo "Missing ${LABEL}_HOST / ${LABEL}_SSH_USER / ${LABEL}_SSH_KEY" >&2
            exit 1
          fi
          echo "plane=$PLANE" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          {
            echo "key<<EOF"
            echo "$KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pack Meridian only
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/meridian/bin/meridian.mjs
          mkdir -p dist
          tar -C packages/meridian -czf dist/meridian.tgz \
            --exclude=node_modules --exclude=out --exclude=coverage --exclude=.git \
            .
          ls -lh dist/meridian.tgz
          BYTES="$(wc -c < dist/meridian.tgz | tr -d ' ')"
          if (( BYTES > 5000000 )); then
            echo "ERROR: Meridian pack unexpectedly large ($BYTES bytes)" >&2
            exit 1
          fi

      - name: Upload + extract on VPS (no website restart)
        shell: bash
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set -euo pipefail
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "${{ steps.ssh.outputs.key }}" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          DEST_HOST="${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}"
          SSH=(ssh -i "$KEYFILE" -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o Compression=no)
          export RSYNC_RSH="${SSH[*]}"
          rsync -a --partial --info=progress2 dist/meridian.tgz "$DEST_HOST:/tmp/meridian.tgz"
          "${SSH[@]}" "$DEST_HOST" "set -euo pipefail
            TARGET='${TARGET_DIR}'
            mkdir -p \"\$TARGET\"
            tar -xzf /tmp/meridian.tgz -C \"\$TARGET\"
            test -f \"\$TARGET/bin/meridian.mjs\"
            rm -f /tmp/meridian.tgz
            echo \"Meridian ready at \$TARGET (plane=${{ steps.ssh.outputs.plane }})\"
            ls -la \"\$TARGET/bin\" \"\$TARGET/profiles\" | head -40
          "
