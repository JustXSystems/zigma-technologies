# Deploy Production — build release in GitHub Actions, ship tarball to Zigma VPS.
# Manual only (workflow_dispatch). confirm_production=DEPLOY_PROD required.
#
# Secrets: PROD_HOST, PROD_SSH_USER, PROD_SSH_KEY
#
# Same SSH firewall note as PreProd: TCP/22 must be reachable from GitHub runners
# or use a self-hosted runner on the Production VPS.
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY_PROD to confirm'
        required: true
        type: string
      branch:
        description: Git branch to build
        required: true
        default: master
        type: string
      apply_release:
        description: Extract tarball on VPS
        type: boolean
        default: true
      restart_pm2:
        description: Restart PM2 zigma (standalone server.js)
        type: boolean
        default: true
      healthcheck:
        description: Localhost + asset curl after restart
        type: boolean
        default: true
      preserve_uploads:
        description: Keep runtime CMS/media uploads on VPS
        type: boolean
        default: true
      db_backup:
        description: mysqldump before apply
        type: boolean
        default: true
      apply_migrations:
        description: Apply SQL migrations
        type: boolean
        default: false
      migration_files:
        description: Comma-separated scripts/*.sql
        required: false
        default: ''
        type: string
      dry_run:
        description: Print apply plan only
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Production release (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Confirm production phrase
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_production }}" != "DEPLOY_PROD" ]]; then
            echo "confirm_production must be exactly DEPLOY_PROD" >&2
            exit 1
          fi
          if [[ "${{ inputs.apply_migrations }}" == "true" && -z "${{ inputs.migration_files }}" ]]; then
            echo "apply_migrations requires migration_files" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install + build (Production — no BASE_PATH)
        env:
          NEXT_PUBLIC_SITE_URL: https://zigma-technologies.com
          MEDIA_BASE_URL: /assets
        run: |
          set -euo pipefail
          # Ensure BASE_PATH is unset for domain-root prod
          unset NEXT_PUBLIC_BASE_PATH || true
          npm ci
          npm run build
          node -e "const b=require('./.next/routes-manifest.json').basePath||''; if(b){console.error('prod must not have basePath',b); process.exit(1)} console.log('basePath empty OK')"

      - name: Package release tarball
        run: |
          set -euo pipefail
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh --env prod --out dist/zigma-prod.tgz
          ls -lh dist/zigma-prod.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: zigma-prod-release
          path: dist/zigma-prod.tgz
          if-no-files-found: error
          retention-days: 14

  deploy-release:
    name: Ship tarball → Zigma Technologies VPS
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require Production SSH secrets
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.PROD_HOST }}"
          USER="${{ secrets.PROD_SSH_USER }}"
          KEY="${{ secrets.PROD_SSH_KEY }}"
          if [[ -z "$HOST" || -z "$USER" || -z "$KEY" ]]; then
            echo "Missing PROD_HOST / PROD_SSH_USER / PROD_SSH_KEY" >&2
            exit 1
          fi
          if [[ "$HOST" == "193.203.161.219" ]]; then
            echo "PROD_HOST must not be PreProd IP" >&2
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          {
            echo "key<<EOF"
            echo "$KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: TCP probe port 22
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ steps.ssh.outputs.host }}"
          if ! timeout 12 bash -c "echo >/dev/tcp/${HOST}/22" 2>/dev/null; then
            echo "GitHub cannot reach ${HOST}:22 — open Hostinger firewall/UFW for SSH or use a self-hosted runner." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: zigma-prod-release
          path: dist

      - name: Flatten tarball path for SCP
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/zigma-prod.tgz
          cp -f dist/zigma-prod.tgz ./zigma-prod.tgz
          ls -lh ./zigma-prod.tgz

      - name: SCP tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ steps.ssh.outputs.key }}
          port: 22
          source: zigma-prod.tgz
          target: /tmp/
          overwrite: true

      - name: Apply release on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          IN_APPLY: ${{ inputs.apply_release }}
          IN_RESTART: ${{ inputs.restart_pm2 }}
          IN_HEALTH: ${{ inputs.healthcheck }}
          IN_PRESERVE: ${{ inputs.preserve_uploads }}
          IN_DB_BACKUP: ${{ inputs.db_backup }}
          IN_MIGRATIONS: ${{ inputs.apply_migrations }}
          IN_MIG_FILES: ${{ inputs.migration_files }}
          IN_DRY: ${{ inputs.dry_run }}
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ steps.ssh.outputs.key }}
          port: 22
          script_stop: true
          command_timeout: 40m
          envs: IN_APPLY,IN_RESTART,IN_HEALTH,IN_PRESERVE,IN_DB_BACKUP,IN_MIGRATIONS,IN_MIG_FILES,IN_DRY
          script: |
            set -euo pipefail
            cd /var/www/zigma-technologies

            TGZ=""
            for candidate in /tmp/zigma-prod.tgz /tmp/dist/zigma-prod.tgz; do
              if [[ -f "$candidate" ]]; then
                TGZ="$candidate"
                break
              fi
            done
            if [[ -z "$TGZ" ]]; then
              echo "ERROR: release tarball not found under /tmp after SCP" >&2
              ls -la /tmp | head -50 >&2
              exit 1
            fi
            if [[ "$TGZ" != /tmp/zigma-prod.tgz ]]; then
              cp -f "$TGZ" /tmp/zigma-prod.tgz
              TGZ=/tmp/zigma-prod.tgz
            fi
            ls -lh "$TGZ"

            mkdir -p /tmp/zigma-rel-script
            tar -xzf "$TGZ" -C /tmp/zigma-rel-script
            APPLY=/tmp/zigma-rel-script/scripts/apply-release.sh
            test -f "$APPLY"
            chmod +x "$APPLY"

            ARGS=(--env prod --confirm-prod DEPLOY_PROD --tarball "$TGZ")
            [[ "${IN_APPLY}" == "true" ]] && ARGS+=(--extract) || ARGS+=(--no-extract)
            [[ "${IN_RESTART}" == "true" ]] && ARGS+=(--restart) || ARGS+=(--no-restart)
            [[ "${IN_HEALTH}" == "true" ]] && ARGS+=(--healthcheck) || ARGS+=(--no-healthcheck)
            [[ "${IN_PRESERVE}" == "true" ]] && ARGS+=(--preserve-uploads) || ARGS+=(--no-preserve-uploads)
            [[ "${IN_DB_BACKUP}" == "true" ]] && ARGS+=(--db-backup) || ARGS+=(--no-db-backup)
            if [[ "${IN_MIGRATIONS}" == "true" ]]; then
              ARGS+=(--migrations --migration-files "${IN_MIG_FILES}")
            else
              ARGS+=(--no-migrations)
            fi
            [[ "${IN_DRY}" == "true" ]] && ARGS+=(--dry-run)

            echo "Running: $APPLY ${ARGS[*]}"
            bash "$APPLY" "${ARGS[@]}"
            rm -f /tmp/zigma-prod.tgz /tmp/dist/zigma-prod.tgz
