# Auto-deploy production to Hostinger KVM 2 (deploy@200.234.45.106).
# Secrets (repo → Settings → Secrets and variables → Actions):
#   PROD_HOST      = 200.234.45.106
#   PROD_SSH_USER  = deploy
#   PROD_SSH_KEY   = private key whose public half is in deploy's authorized_keys
# On the VPS, scripts/deploy-prod.sh runs: git reset --hard origin/master → npm ci → build → pm2 restart
name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /var/www/zigma-technologies
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
