# Deploy Production — one button for the full prod stack.
#
# Parallel after confirm:
#   • Build + delta-rsync website stage (product plane — warm deploys skip unchanged files)
#   • Ship Meridian CLI → /var/www/zigma-meridian (control plane, ~1 MiB)
# After site is live:
#   • Pin MERIDIAN_HOME on the site .env (restart only if changed)
#   • SEO Command Brief (GSC/Bing when secrets exist)
#
# Secrets: PROD_HOST, PROD_SSH_USER, PROD_SSH_KEY
# Optional SEO: MERIDIAN_GOOGLE_*, MERIDIAN_BING_API_KEY, MERIDIAN_GA4_PROPERTY_ID, MERIDIAN_PSI_API_KEY
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY_PROD to confirm'
        required: true
        type: string
      branch:
        description: Git branch to build
        required: true
        default: master
        type: string
      apply_release:
        description: Extract tarball on VPS
        type: boolean
        default: true
      restart_pm2:
        description: Restart PM2 zigma (standalone server.js)
        type: boolean
        default: true
      healthcheck:
        description: Localhost + asset curl after restart
        type: boolean
        default: true
      preserve_uploads:
        description: Keep runtime CMS/media uploads on VPS
        type: boolean
        default: true
      db_backup:
        description: mysqldump before apply
        type: boolean
        default: true
      apply_migrations:
        description: Apply SQL migrations
        type: boolean
        default: false
      migration_files:
        description: Comma-separated scripts/*.sql
        required: false
        default: ''
        type: string
      dry_run:
        description: Print apply plan only
        type: boolean
        default: false
      ship_meridian:
        description: Ship Meridian sidecar in parallel with the site build
        type: boolean
        default: true
      meridian_dir:
        description: Meridian install path on VPS
        type: string
        default: /var/www/zigma-meridian
      run_seo_report:
        description: After deploy — live verify + Command Brief (Actions artefacts)
        type: boolean
        default: true
      post_deploy_autopilot:
        description: Also run full Meridian autopilot (slow; off by default)
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Confirm production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm production phrase
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_production }}" != "DEPLOY_PROD" ]]; then
            echo "confirm_production must be exactly DEPLOY_PROD" >&2
            exit 1
          fi
          MIG_FILES="$(echo '${{ inputs.migration_files }}' | xargs)"
          if [[ "${{ inputs.apply_migrations }}" == "true" && -z "$MIG_FILES" ]]; then
            echo "::warning::apply_migrations was true but migration_files is empty — deploy will skip SQL migrations."
            echo "Re-run with migration_files (e.g. migrate-wave3.sql) only when you intentionally apply schema changes."
            echo "Logo/site-settings typography releases do not need SQL migrations."
          fi
          {
            echo "## Deploy Production (unified)"
            echo ""
            echo "| Track | Enabled |"
            echo "| --- | --- |"
            echo "| Website build + apply | yes |"
            echo "| Meridian sidecar (parallel) | \`${{ inputs.ship_meridian }}\` → \`${{ inputs.meridian_dir }}\` |"
            echo "| SEO Command Brief after live | \`${{ inputs.run_seo_report }}\` |"
            echo "| Full autopilot (optional) | \`${{ inputs.post_deploy_autopilot }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Product plane ──────────────────────────────────────────────────────────
  build-release:
    name: Build Production release (CI)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install + build (Production — no BASE_PATH)
        env:
          NEXT_PUBLIC_SITE_URL: https://zigma-technologies.com
          NEXT_PUBLIC_SEO_INDEXABLE: 'true'
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          MEDIA_BASE_URL: /assets
        run: |
          set -euo pipefail
          unset NEXT_PUBLIC_BASE_PATH || true
          npm ci
          npm run build
          node scripts/verify-seo-build.mjs --env prod

      - name: Package release stage (+ optional .tgz artifact)
        run: |
          set -euo pipefail
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh --env prod \
            --stage-dir dist/zigma-prod-stage \
            --out dist/zigma-prod.tgz
          test -f dist/zigma-prod-stage/server.js
          test -f dist/zigma-prod-stage/.next/BUILD_ID
          test -d dist/zigma-prod-stage/.next/static
          ls -lh dist/zigma-prod.tgz
          du -sh dist/zigma-prod-stage
          echo "BUILD_ID=$(cat dist/zigma-prod-stage/.next/BUILD_ID)"

      # .next is a hidden dir — upload-artifact omits it unless include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: zigma-prod-release-stage
          path: dist/zigma-prod-stage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: zigma-prod-release-tgz
          path: dist/zigma-prod.tgz
          if-no-files-found: error
          retention-days: 14

  # ── Control plane (parallel with Next build — does not wait for site tarball) ─
  ship-meridian:
    name: Meridian sidecar (parallel)
    needs: gate
    if: ${{ inputs.ship_meridian }}
    uses: ./.github/workflows/deploy-meridian.yml
    with:
      plane: prod
      branch: ${{ inputs.branch }}
      target_dir: ${{ inputs.meridian_dir }}
    secrets: inherit

  deploy-release:
    name: Delta-rsync stage → Zigma Technologies VPS
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require Production SSH secrets
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.PROD_HOST }}"
          USER="${{ secrets.PROD_SSH_USER }}"
          KEY="${{ secrets.PROD_SSH_KEY }}"
          if [[ -z "$HOST" || -z "$USER" || -z "$KEY" ]]; then
            echo "Missing PROD_HOST / PROD_SSH_USER / PROD_SSH_KEY" >&2
            exit 1
          fi
          if [[ "$HOST" == "193.203.161.219" ]]; then
            echo "PROD_HOST must not be PreProd IP" >&2
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          {
            echo "key<<EOF"
            echo "$KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: TCP probe port 22
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ steps.ssh.outputs.host }}"
          if ! timeout 12 bash -c "echo >/dev/tcp/${HOST}/22" 2>/dev/null; then
            echo "GitHub cannot reach ${HOST}:22 — open Hostinger firewall/UFW for SSH or use a self-hosted runner." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          sparse-checkout: |
            scripts/apply-release.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: zigma-prod-release-stage
          path: release-stage

      - name: Delta-rsync release stage + apply script to VPS
        shell: bash
        run: |
          set -euo pipefail
          test -f release-stage/server.js
          test -f release-stage/.next/BUILD_ID
          test -d release-stage/.next/static
          test -f scripts/apply-release.sh
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "${{ steps.ssh.outputs.key }}" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          DEST_HOST="${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}"
          REMOTE_STAGE=/tmp/zigma-release-stage
          SSH_BASE=( -i "$KEYFILE" -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o Compression=no )
          export RSYNC_RSH="ssh ${SSH_BASE[*]}"
          ssh "${SSH_BASE[@]}" "$DEST_HOST" "mkdir -p '$REMOTE_STAGE'"
          echo "Delta-rsync release-stage/ → ${DEST_HOST}:${REMOTE_STAGE}/"
          # Persistent remote stage = warm deploys only send changed files.
          rsync -a --delete --partial --info=stats2,progress2 \
            release-stage/ "$DEST_HOST:$REMOTE_STAGE/"
          rsync -a --partial scripts/apply-release.sh "$DEST_HOST:/tmp/apply-release.sh"
          ssh "${SSH_BASE[@]}" "$DEST_HOST" "test -f '$REMOTE_STAGE/.next/BUILD_ID' && test -d '$REMOTE_STAGE/.next/static'"
          echo "Upload complete (delta rsync)."

      - name: Apply release on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          IN_APPLY: ${{ inputs.apply_release }}
          IN_RESTART: ${{ inputs.restart_pm2 }}
          IN_HEALTH: ${{ inputs.healthcheck }}
          IN_PRESERVE: ${{ inputs.preserve_uploads }}
          IN_DB_BACKUP: ${{ inputs.db_backup }}
          IN_MIGRATIONS: ${{ inputs.apply_migrations }}
          IN_MIG_FILES: ${{ inputs.migration_files }}
          IN_DRY: ${{ inputs.dry_run }}
          MERIDIAN_DIR: ${{ inputs.meridian_dir }}
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ steps.ssh.outputs.key }}
          port: 22
          command_timeout: 40m
          envs: IN_APPLY,IN_RESTART,IN_HEALTH,IN_PRESERVE,IN_DB_BACKUP,IN_MIGRATIONS,IN_MIG_FILES,IN_DRY,MERIDIAN_DIR
          script: |
            set -euxo pipefail
            cd /var/www/zigma-technologies

            STAGE=/tmp/zigma-release-stage
            echo "Stage listing (top):"
            ls -la "$STAGE" | head -40
            test -f "$STAGE/server.js"
            test -f "$STAGE/release-manifest.json"
            test -f "$STAGE/.next/BUILD_ID"
            test -d "$STAGE/.next/static"
            echo "BUILD_ID=$(cat "$STAGE/.next/BUILD_ID")"

            APPLY=/tmp/apply-release.sh
            test -f "$APPLY"
            chmod +x "$APPLY"
            # Strip CRLF if checkout ever emits them (silent bash failures)
            sed -i 's/\r$//' "$APPLY" || true

            ARGS=(--env prod --confirm-prod DEPLOY_PROD --stage "$STAGE")
            if [ "${IN_APPLY}" = "true" ]; then ARGS+=(--extract); else ARGS+=(--no-extract); fi
            if [ "${IN_RESTART}" = "true" ]; then ARGS+=(--restart); else ARGS+=(--no-restart); fi
            if [ "${IN_HEALTH}" = "true" ]; then ARGS+=(--healthcheck); else ARGS+=(--no-healthcheck); fi
            if [ "${IN_PRESERVE}" = "true" ]; then ARGS+=(--preserve-uploads); else ARGS+=(--no-preserve-uploads); fi
            if [ "${IN_DB_BACKUP}" = "true" ]; then ARGS+=(--db-backup); else ARGS+=(--no-db-backup); fi
            if [ "${IN_MIGRATIONS}" = "true" ]; then
              MIG_FILES="$(echo "${IN_MIG_FILES:-}" | xargs)"
              if [ -z "$MIG_FILES" ]; then
                echo "WARNING: migrations requested but migration_files empty — using --no-migrations" >&2
                ARGS+=(--no-migrations)
              else
                ARGS+=(--migrations --migration-files "$MIG_FILES")
              fi
            else
              ARGS+=(--no-migrations)
            fi
            if [ "${IN_DRY}" = "true" ]; then ARGS+=(--dry-run); fi

            echo "Running: $APPLY ${ARGS[*]}"
            bash "$APPLY" "${ARGS[@]}"
            rm -f /tmp/apply-release.sh
            # Keep $STAGE as delta cache for the next deploy.

            # Pin Meridian control-plane env (best-effort — never fail the website deploy)
            MDIR="${MERIDIAN_DIR:-/var/www/zigma-meridian}"
            APP=/var/www/zigma-technologies
            ENV_FILE="$APP/.env"
            pin_env() {
              local key="$1" val="$2" cur
              cur="$(grep -E "^${key}=" "$ENV_FILE" 2>/dev/null | tail -n1 || true)"
              if [ "$cur" = "${key}=${val}" ]; then
                echo "$key already correct"
                return 1
              fi
              if grep -qE "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
              else
                printf '\n%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              fi
              echo "Updated .env → ${key}=${val}"
              return 0
            }
            CHANGED=0
            if [ -f "$ENV_FILE" ]; then
              pin_env MERIDIAN_SITE_ROOT "$APP" && CHANGED=1 || true
              if [ -f "$MDIR/bin/meridian.mjs" ]; then
                pin_env MERIDIAN_HOME "$MDIR" && CHANGED=1 || true
              else
                echo "Skip MERIDIAN_HOME pin (sidecar missing at $MDIR)"
              fi
              if [ "$CHANGED" = "1" ] && [ "${IN_RESTART}" = "true" ] && [ "${IN_DRY}" != "true" ]; then
                pm2 restart zigma --update-env || echo "WARNING: pm2 --update-env failed (site already restarted by apply)"
              fi
            else
              echo "Skip Meridian env pin (no .env) — site deploy OK"
            fi

  # Control-plane desk (CI artefacts) — waits for Meridian job to finish/skip, never blocked by its failure
  seo-report:
    name: SEO Command Brief (post-deploy)
    needs: [deploy-release, ship-meridian]
    if: |
      always() &&
      !inputs.dry_run &&
      inputs.apply_release &&
      inputs.run_seo_report &&
      needs.deploy-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check connector secrets
        id: secrets
        env:
          MERIDIAN_GOOGLE_CLIENT_ID: ${{ secrets.MERIDIAN_GOOGLE_CLIENT_ID }}
          MERIDIAN_GOOGLE_CLIENT_SECRET: ${{ secrets.MERIDIAN_GOOGLE_CLIENT_SECRET }}
          MERIDIAN_GOOGLE_REFRESH_TOKEN: ${{ secrets.MERIDIAN_GOOGLE_REFRESH_TOKEN }}
          MERIDIAN_BING_API_KEY: ${{ secrets.MERIDIAN_BING_API_KEY }}
        run: |
          set -euo pipefail
          MISSING=()
          [[ -n "${MERIDIAN_GOOGLE_CLIENT_ID:-}" ]] || MISSING+=("MERIDIAN_GOOGLE_CLIENT_ID")
          [[ -n "${MERIDIAN_GOOGLE_CLIENT_SECRET:-}" ]] || MISSING+=("MERIDIAN_GOOGLE_CLIENT_SECRET")
          [[ -n "${MERIDIAN_GOOGLE_REFRESH_TOKEN:-}" ]] || MISSING+=("MERIDIAN_GOOGLE_REFRESH_TOKEN")
          [[ -n "${MERIDIAN_BING_API_KEY:-}" ]] || MISSING+=("MERIDIAN_BING_API_KEY")
          if ((${#MISSING[@]} > 0)); then
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing Actions secrets: ${MISSING[*]} — report will be verify-only until set"
          else
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for apex settle
        run: sleep 8

      - name: Generate SEO report (control plane)
        env:
          MERIDIAN_GOOGLE_CLIENT_ID: ${{ secrets.MERIDIAN_GOOGLE_CLIENT_ID }}
          MERIDIAN_GOOGLE_CLIENT_SECRET: ${{ secrets.MERIDIAN_GOOGLE_CLIENT_SECRET }}
          MERIDIAN_GOOGLE_REFRESH_TOKEN: ${{ secrets.MERIDIAN_GOOGLE_REFRESH_TOKEN }}
          MERIDIAN_GA4_PROPERTY_ID: ${{ secrets.MERIDIAN_GA4_PROPERTY_ID }}
          MERIDIAN_BING_API_KEY: ${{ secrets.MERIDIAN_BING_API_KEY }}
          MERIDIAN_PSI_API_KEY: ${{ secrets.MERIDIAN_PSI_API_KEY }}
          MERIDIAN_WEBHOOK_URL: ${{ secrets.MERIDIAN_WEBHOOK_URL }}
          MERIDIAN_WEBHOOK_ALERTS_ONLY: '1'
          MERIDIAN_CI_SOFT_AUTH: '1'
        run: |
          set -euo pipefail
          ARGS=(act seo-report --profile packages/meridian/profiles/zigma.prod.json --window 28 --theme aurora --skip-psi --skip-scan)
          set +e
          node packages/meridian/bin/meridian.mjs "${ARGS[@]}"
          CODE=$?
          set -e
          test -f storage/meridian/zigma-prod/command-brief.html
          STATUS="$(node -e "const j=require('./storage/meridian/zigma-prod/seo-report.json'); console.log(j.status||'')" 2>/dev/null || true)"
          VERIFY="$(node -e "const j=require('./storage/meridian/zigma-prod/seo-report.json'); console.log(j.data?.liveVerify?.ok===false?'fail':'ok')" 2>/dev/null || echo ok)"
          echo "exit=$CODE status=$STATUS verify=$VERIFY"
          if [ "$VERIFY" = "fail" ]; then
            echo "::error::Live SEO verify failed on production"
            exit 1
          fi
          if [ "$STATUS" = "auth_required" ] || [ "${{ steps.secrets.outputs.has_auth }}" != "true" ]; then
            echo "::warning::Live verify OK — GSC/Bing skipped until Actions secrets are set"
            exit 0
          fi
          exit "$CODE"

      - name: Sync Command Brief to Production Admin desk
        if: always()
        continue-on-error: true
        env:
          DEST_HOST: ${{ secrets.PROD_HOST }}
          DEST_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEST_HOST:-}" || -z "${DEST_USER:-}" || -z "${PROD_SSH_KEY:-}" ]]; then
            echo "::warning::PROD_* SSH secrets missing — desk sync skipped"
            exit 0
          fi
          KEY="$(mktemp)"
          printf '%s\n' "$PROD_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          chmod +x scripts/sync-meridian-desk-to-vps.sh
          # Soft-fail inside script; continue-on-error keeps job green if Hostinger blocks port 22 mid-run
          SSH_KEY_PATH="$KEY" DEST_HOST="$DEST_HOST" DEST_USER="$DEST_USER" \
            ./scripts/sync-meridian-desk-to-vps.sh || true
          rm -f "$KEY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-command-brief-prod-deploy
          path: |
            storage/meridian/zigma-prod/command-brief.html
            storage/meridian/zigma-prod/command-brief.md
            storage/meridian/zigma-prod/command-brief.json
            storage/meridian/zigma-prod/seo-report.json
            storage/meridian/zigma-prod/seo-report.md
            storage/meridian/zigma-prod/seo-live-verify.json
            storage/meridian/zigma-prod/seo-report-sources.json
          if-no-files-found: warn
          retention-days: 60

  # Optional heavy path — off by default (was the old post-deploy job)
  meridian-autopilot:
    name: Meridian autopilot (optional)
    needs: [deploy-release, ship-meridian]
    if: |
      always() &&
      !inputs.dry_run &&
      inputs.apply_release &&
      inputs.healthcheck &&
      inputs.post_deploy_autopilot &&
      needs.deploy-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Meridian autopilot against live apex
        env:
          MERIDIAN_GOOGLE_CLIENT_ID: ${{ secrets.MERIDIAN_GOOGLE_CLIENT_ID }}
          MERIDIAN_GOOGLE_CLIENT_SECRET: ${{ secrets.MERIDIAN_GOOGLE_CLIENT_SECRET }}
          MERIDIAN_GOOGLE_REFRESH_TOKEN: ${{ secrets.MERIDIAN_GOOGLE_REFRESH_TOKEN }}
          MERIDIAN_GA4_PROPERTY_ID: ${{ secrets.MERIDIAN_GA4_PROPERTY_ID }}
          MERIDIAN_BING_API_KEY: ${{ secrets.MERIDIAN_BING_API_KEY }}
          MERIDIAN_PSI_API_KEY: ${{ secrets.MERIDIAN_PSI_API_KEY }}
          MERIDIAN_WEBHOOK_URL: ${{ secrets.MERIDIAN_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          sleep 8
          npm run meridian:autopilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meridian-report-prod
          path: storage/meridian/
          if-no-files-found: ignore
          retention-days: 14
