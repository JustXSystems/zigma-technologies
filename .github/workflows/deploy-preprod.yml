# Deploy PreProd — one button (and push-to-master) for the full preprod stack.
#
# Parallel after gate:
#   • Build + delta-rsync website stage (product plane, noindex — warm deploys skip unchanged files)
#   • Ship Meridian CLI → /var/www/zigma-meridian on JustXSystems VPS
# After site is live:
#   • Pin MERIDIAN_HOME on the site .env (restart only if changed)
#   • SEO Command Brief against PreProd (verify / noindex desk; GSC/Bing off in profile)
#
# Secrets: PREPROD_HOST, PREPROD_SSH_USER, PREPROD_SSH_KEY
name: Deploy PreProd

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to build
        required: true
        default: master
        type: string
      apply_release:
        description: Extract tarball on VPS
        type: boolean
        default: true
      restart_pm2:
        description: Restart PM2 (standalone server.js)
        type: boolean
        default: true
      healthcheck:
        description: Localhost + asset curl after restart
        type: boolean
        default: true
      preserve_uploads:
        description: Keep runtime CMS/media uploads on VPS
        type: boolean
        default: true
      db_backup:
        description: mysqldump before apply
        type: boolean
        default: false
      apply_migrations:
        description: Apply SQL migrations (also set migration_files)
        type: boolean
        default: false
      migration_files:
        description: "Comma-separated scripts/*.sql e.g. migrate-catalog-discovery.sql,migrate-catalog-background.sql"
        required: false
        default: ''
        type: string
      dry_run:
        description: Print apply plan only on VPS
        type: boolean
        default: false
      ship_meridian:
        description: Ship Meridian sidecar in parallel with the site build
        type: boolean
        default: true
      meridian_dir:
        description: Meridian install path on PreProd VPS
        type: string
        default: /var/www/zigma-meridian
      run_seo_report:
        description: After deploy — live verify + Command Brief (Actions artefacts)
        type: boolean
        default: true
      post_deploy_autopilot:
        description: Also run Meridian autopilot preprod (slow; off by default)
        type: boolean
        default: false

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  gate:
    name: Resolve PreProd options
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.opts.outputs.branch }}
      apply: ${{ steps.opts.outputs.apply }}
      restart: ${{ steps.opts.outputs.restart }}
      health: ${{ steps.opts.outputs.health }}
      preserve: ${{ steps.opts.outputs.preserve }}
      db_backup: ${{ steps.opts.outputs.db_backup }}
      migrations: ${{ steps.opts.outputs.migrations }}
      migration_files: ${{ steps.opts.outputs.migration_files }}
      dry_run: ${{ steps.opts.outputs.dry_run }}
      ship_meridian: ${{ steps.opts.outputs.ship_meridian }}
      meridian_dir: ${{ steps.opts.outputs.meridian_dir }}
      run_seo_report: ${{ steps.opts.outputs.run_seo_report }}
      post_deploy_autopilot: ${{ steps.opts.outputs.post_deploy_autopilot }}
    steps:
      - name: Resolve options (push defaults vs dispatch)
        id: opts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MIG="${{ inputs.apply_migrations }}"
            MIG_FILES="$(echo '${{ inputs.migration_files }}' | xargs)"
            if [[ "$MIG" == "true" && -z "$MIG_FILES" ]]; then
              echo "::warning::apply_migrations was true but migration_files is empty — skipping SQL migrations."
              MIG=false
            fi
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "apply=${{ inputs.apply_release }}" >> "$GITHUB_OUTPUT"
            echo "restart=${{ inputs.restart_pm2 }}" >> "$GITHUB_OUTPUT"
            echo "health=${{ inputs.healthcheck }}" >> "$GITHUB_OUTPUT"
            echo "preserve=${{ inputs.preserve_uploads }}" >> "$GITHUB_OUTPUT"
            echo "db_backup=${{ inputs.db_backup }}" >> "$GITHUB_OUTPUT"
            echo "migrations=$MIG" >> "$GITHUB_OUTPUT"
            echo "migration_files=$MIG_FILES" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "ship_meridian=${{ inputs.ship_meridian }}" >> "$GITHUB_OUTPUT"
            echo "meridian_dir=${{ inputs.meridian_dir }}" >> "$GITHUB_OUTPUT"
            echo "run_seo_report=${{ inputs.run_seo_report }}" >> "$GITHUB_OUTPUT"
            echo "post_deploy_autopilot=${{ inputs.post_deploy_autopilot }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=master" >> "$GITHUB_OUTPUT"
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "health=true" >> "$GITHUB_OUTPUT"
            echo "preserve=true" >> "$GITHUB_OUTPUT"
            echo "db_backup=false" >> "$GITHUB_OUTPUT"
            echo "migrations=false" >> "$GITHUB_OUTPUT"
            echo "migration_files=" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "ship_meridian=true" >> "$GITHUB_OUTPUT"
            echo "meridian_dir=/var/www/zigma-meridian" >> "$GITHUB_OUTPUT"
            echo "run_seo_report=true" >> "$GITHUB_OUTPUT"
            echo "post_deploy_autopilot=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Deploy PreProd (unified)"
            echo ""
            echo "| Track | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Meridian sidecar (parallel) | yes (default) → \`/var/www/zigma-meridian\` |"
            echo "| SEO Command Brief after live | yes (default) |"
            echo "| Full autopilot | off unless checked |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Product plane ──────────────────────────────────────────────────────────
  build-release:
    name: Build PreProd release (CI)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install + build (PreProd public env baked in)
        env:
          NEXT_PUBLIC_BASE_PATH: /zigma-technologies
          NEXT_PUBLIC_SITE_URL: https://justxsystems.com/zigma-technologies
          MEDIA_BASE_URL: /assets
          NEXT_PUBLIC_SEO_INDEXABLE: ''
        run: |
          set -euo pipefail
          unset NEXT_PUBLIC_SEO_INDEXABLE || true
          npm ci
          npm run build
          node scripts/verify-seo-build.mjs --env preprod

      - name: Package release stage (+ optional .tgz artifact)
        run: |
          set -euo pipefail
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh --env preprod \
            --stage-dir dist/zigma-preprod-stage \
            --out dist/zigma-preprod.tgz
          test -f dist/zigma-preprod-stage/server.js
          test -f dist/zigma-preprod-stage/.next/BUILD_ID
          test -d dist/zigma-preprod-stage/.next/static
          ls -lh dist/zigma-preprod.tgz
          du -sh dist/zigma-preprod-stage
          echo "BUILD_ID=$(cat dist/zigma-preprod-stage/.next/BUILD_ID)"

      # .next is a hidden dir — upload-artifact omits it unless include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: zigma-preprod-release-stage
          path: dist/zigma-preprod-stage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: zigma-preprod-release-tgz
          path: dist/zigma-preprod.tgz
          if-no-files-found: error
          retention-days: 14

  # ── Control plane (parallel with Next build) ───────────────────────────────
  ship-meridian:
    name: Meridian sidecar (parallel)
    needs: gate
    if: ${{ needs.gate.outputs.ship_meridian == 'true' }}
    uses: ./.github/workflows/deploy-meridian.yml
    with:
      plane: preprod
      branch: ${{ needs.gate.outputs.branch }}
      target_dir: ${{ needs.gate.outputs.meridian_dir }}
    secrets: inherit

  deploy-release:
    name: Delta-rsync stage → JustXSystems VPS
    needs: [gate, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require PreProd SSH secrets
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.PREPROD_HOST }}"
          USER="${{ secrets.PREPROD_SSH_USER }}"
          KEY="${{ secrets.PREPROD_SSH_KEY }}"
          if [[ -z "$HOST" || -z "$USER" || -z "$KEY" ]]; then
            echo "Missing PREPROD_HOST / PREPROD_SSH_USER / PREPROD_SSH_KEY" >&2
            exit 1
          fi
          if [[ "$HOST" == "200.234.45.106" ]]; then
            echo "PREPROD_HOST must not be Production IP" >&2
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          {
            echo "key<<EOF"
            echo "$KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: TCP probe port 22 (fail with clear firewall guidance)
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ steps.ssh.outputs.host }}"
          echo "Probing ${HOST}:22 from GitHub runner…"
          if ! timeout 12 bash -c "echo >/dev/tcp/${HOST}/22" 2>/dev/null; then
            cat <<'MSG' >&2
          ============================================================
          GitHub Actions cannot open TCP port 22 to the PreProd VPS.
          Fix ONE of:
            A) Hostinger hPanel → VPS Firewall + UFW: allow TCP 22 from Anywhere
            B) Install a self-hosted GitHub runner ON the VPS (outbound only)
               then use workflow deploy-preprod-self-hosted.yml
          ============================================================
          MSG
            exit 1
          fi
          echo "Port 22 reachable."

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.branch }}
          sparse-checkout: |
            scripts/apply-release.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: zigma-preprod-release-stage
          path: release-stage

      - name: Delta-rsync release stage + apply script to VPS
        shell: bash
        run: |
          set -euo pipefail
          test -f release-stage/server.js
          test -f release-stage/.next/BUILD_ID
          test -d release-stage/.next/static
          test -f scripts/apply-release.sh
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "${{ steps.ssh.outputs.key }}" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          DEST_HOST="${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}"
          REMOTE_STAGE=/tmp/zigma-release-stage
          SSH_BASE=( -i "$KEYFILE" -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o Compression=no )
          export RSYNC_RSH="ssh ${SSH_BASE[*]}"
          ssh "${SSH_BASE[@]}" "$DEST_HOST" "mkdir -p '$REMOTE_STAGE'"
          echo "Delta-rsync release-stage/ → ${DEST_HOST}:${REMOTE_STAGE}/"
          rsync -a --delete --partial --info=stats2,progress2 \
            release-stage/ "$DEST_HOST:$REMOTE_STAGE/"
          rsync -a --partial scripts/apply-release.sh "$DEST_HOST:/tmp/apply-release.sh"
          ssh "${SSH_BASE[@]}" "$DEST_HOST" "test -f '$REMOTE_STAGE/.next/BUILD_ID' && test -d '$REMOTE_STAGE/.next/static'"
          echo "Upload complete (delta rsync)."

      - name: Apply release on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          IN_APPLY: ${{ needs.gate.outputs.apply }}
          IN_RESTART: ${{ needs.gate.outputs.restart }}
          IN_HEALTH: ${{ needs.gate.outputs.health }}
          IN_PRESERVE: ${{ needs.gate.outputs.preserve }}
          IN_DB_BACKUP: ${{ needs.gate.outputs.db_backup }}
          IN_MIGRATIONS: ${{ needs.gate.outputs.migrations }}
          IN_MIG_FILES: ${{ needs.gate.outputs.migration_files }}
          IN_DRY: ${{ needs.gate.outputs.dry_run }}
          MERIDIAN_DIR: ${{ needs.gate.outputs.meridian_dir }}
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ steps.ssh.outputs.key }}
          port: 22
          command_timeout: 20m
          envs: IN_APPLY,IN_RESTART,IN_HEALTH,IN_PRESERVE,IN_DB_BACKUP,IN_MIGRATIONS,IN_MIG_FILES,IN_DRY,MERIDIAN_DIR
          script: |
            set -euxo pipefail
            cd /var/www/zigma-technologies

            STAGE=/tmp/zigma-release-stage
            echo "Stage listing (top):"
            ls -la "$STAGE" | head -40
            test -f "$STAGE/server.js"
            test -f "$STAGE/release-manifest.json"
            test -f "$STAGE/.next/BUILD_ID"
            test -d "$STAGE/.next/static"
            echo "BUILD_ID=$(cat "$STAGE/.next/BUILD_ID")"

            APPLY=/tmp/apply-release.sh
            test -f "$APPLY"
            chmod +x "$APPLY"
            sed -i 's/\r$//' "$APPLY" || true

            ARGS=(--env preprod --stage "$STAGE")
            if [ "${IN_APPLY}" = "true" ]; then ARGS+=(--extract); else ARGS+=(--no-extract); fi
            if [ "${IN_RESTART}" = "true" ]; then ARGS+=(--restart); else ARGS+=(--no-restart); fi
            if [ "${IN_HEALTH}" = "true" ]; then ARGS+=(--healthcheck); else ARGS+=(--no-healthcheck); fi
            if [ "${IN_PRESERVE}" = "true" ]; then ARGS+=(--preserve-uploads); else ARGS+=(--no-preserve-uploads); fi
            if [ "${IN_DB_BACKUP}" = "true" ]; then ARGS+=(--db-backup); else ARGS+=(--no-db-backup); fi
            if [ "${IN_MIGRATIONS}" = "true" ]; then
              MIG_FILES="$(echo "${IN_MIG_FILES:-}" | xargs)"
              if [ -z "$MIG_FILES" ]; then
                echo "WARNING: migrations requested but migration_files empty — using --no-migrations" >&2
                ARGS+=(--no-migrations)
              else
                ARGS+=(--migrations --migration-files "$MIG_FILES")
              fi
            else
              ARGS+=(--no-migrations)
            fi
            if [ "${IN_DRY}" = "true" ]; then ARGS+=(--dry-run); fi

            echo "Running: $APPLY ${ARGS[*]}"
            bash "$APPLY" "${ARGS[@]}"
            rm -f /tmp/apply-release.sh
            # Keep $STAGE as delta cache for the next deploy.

            MDIR="${MERIDIAN_DIR:-/var/www/zigma-meridian}"
            APP=/var/www/zigma-technologies
            ENV_FILE="$APP/.env"
            pin_env() {
              local key="$1" val="$2" cur
              cur="$(grep -E "^${key}=" "$ENV_FILE" 2>/dev/null | tail -n1 || true)"
              if [ "$cur" = "${key}=${val}" ]; then
                echo "$key already correct"
                return 1
              fi
              if grep -qE "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
              else
                printf '\n%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              fi
              echo "Updated .env → ${key}=${val}"
              return 0
            }
            CHANGED=0
            if [ -f "$ENV_FILE" ]; then
              pin_env MERIDIAN_SITE_ROOT "$APP" && CHANGED=1 || true
              if [ -f "$MDIR/bin/meridian.mjs" ]; then
                pin_env MERIDIAN_HOME "$MDIR" && CHANGED=1 || true
              else
                echo "Skip MERIDIAN_HOME pin (sidecar missing at $MDIR)"
              fi
              if [ "$CHANGED" = "1" ] && [ "${IN_RESTART}" = "true" ] && [ "${IN_DRY}" != "true" ]; then
                pm2 restart zigma-preprod --update-env || echo "WARNING: pm2 --update-env failed (site already restarted by apply)"
              fi
            else
              echo "Skip Meridian env pin (no .env) — site deploy OK"
            fi

  seo-report:
    name: SEO Command Brief (post-deploy)
    needs: [gate, deploy-release, ship-meridian]
    if: |
      always() &&
      needs.gate.outputs.dry_run != 'true' &&
      needs.gate.outputs.apply == 'true' &&
      needs.gate.outputs.run_seo_report == 'true' &&
      needs.deploy-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for PreProd settle
        run: sleep 8

      - name: Generate SEO report (PreProd profile — GSC/Bing off)
        env:
          MERIDIAN_CI_SOFT_AUTH: '1'
        run: |
          set -euo pipefail
          ARGS=(act seo-report --profile packages/meridian/profiles/zigma.preprod.json --window 28 --theme aurora --skip-psi --skip-scan)
          set +e
          node packages/meridian/bin/meridian.mjs "${ARGS[@]}"
          CODE=$?
          set -e
          test -f storage/meridian/zigma-preprod/command-brief.html || test -f storage/meridian/zigma-preprod/seo-report.json
          VERIFY="$(node -e "const j=require('./storage/meridian/zigma-preprod/seo-report.json'); console.log(j.data?.liveVerify?.ok===false?'fail':'ok')" 2>/dev/null || echo ok)"
          echo "exit=$CODE verify=$VERIFY"
          if [ "$VERIFY" = "fail" ]; then
            echo "::error::Live SEO verify failed on PreProd"
            exit 1
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-command-brief-preprod-deploy
          path: |
            storage/meridian/zigma-preprod/command-brief.html
            storage/meridian/zigma-preprod/command-brief.md
            storage/meridian/zigma-preprod/command-brief.json
            storage/meridian/zigma-preprod/seo-report.json
            storage/meridian/zigma-preprod/seo-report.md
            storage/meridian/zigma-preprod/seo-live-verify.json
            storage/meridian/zigma-preprod/seo-report-sources.json
          if-no-files-found: warn
          retention-days: 30

  meridian-autopilot:
    name: Meridian autopilot PreProd (optional)
    needs: [gate, deploy-release, ship-meridian]
    if: |
      always() &&
      needs.gate.outputs.dry_run != 'true' &&
      needs.gate.outputs.apply == 'true' &&
      needs.gate.outputs.health == 'true' &&
      needs.gate.outputs.post_deploy_autopilot == 'true' &&
      needs.deploy-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Meridian autopilot against PreProd
        run: |
          set -euo pipefail
          sleep 8
          npm run meridian:autopilot:preprod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meridian-report-preprod
          path: storage/meridian/
          if-no-files-found: ignore
          retention-days: 14
